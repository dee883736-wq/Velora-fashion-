<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VÉLORA — Store</title>
<style>
:root{--ink:#111;--muted:#777;--line:#e7e5e0;--soft:#f7f6f2;--gold:#c99420}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#fff}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1200px;margin:auto;padding:18px 20px;display:flex;align-items:center;gap:16px}.logo{font-weight:900;letter-spacing:5px;font-size:25px}.spacer{flex:1}
.navbtn{border:1px solid var(--line);background:#111;color:#fff;border-radius:999px;padding:11px 17px;font-weight:700}.navbtn.light{background:#fff;color:#111}
.hero{max-width:1200px;margin:auto;padding:35px 20px 20px}.hero h1{font-size:clamp(32px,6vw,62px);line-height:.98;margin:0 0 12px;letter-spacing:-2px}.hero p{color:var(--muted);max-width:650px}
.tools{max-width:1200px;margin:auto;padding:0 20px 18px;display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--soft);outline:none}.cat{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px}.cat.active{background:#111;color:#fff}
.grid{max-width:1200px;margin:auto;padding:10px 20px 80px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff}.pic{height:300px;background:#f1f1ef;position:relative}.pic img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;left:12px;top:12px;background:#111;color:#fff;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.info{padding:16px}.info h3{margin:0 0 5px;font-size:18px}.muted{color:var(--muted);font-size:13px}.price{font-size:20px;font-weight:900;margin:10px 0}.old{text-decoration:line-through;color:#aaa;font-size:14px;margin-left:7px}.add{width:100%;border:0;background:#111;color:#fff;padding:13px;border-radius:13px;font-weight:800}.review{margin-top:9px;width:100%;border:1px solid var(--line);background:#fff;padding:10px;border-radius:13px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.2s;z-index:50}.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;right:-440px;top:0;bottom:0;width:min(440px,100%);background:#fff;z-index:60;padding:22px;transition:.25s;overflow:auto}.drawer.open{right:0}.close{border:0;background:#f2f2ef;width:40px;height:40px;border-radius:50%;font-size:22px}.cartrow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.cartrow img{width:62px;height:70px;object-fit:cover;border-radius:10px}.qty button{border:1px solid var(--line);background:#fff;border-radius:7px;width:28px;height:28px}.checkout{width:100%;padding:14px;border:0;border-radius:13px;background:#111;color:#fff;font-weight:800;margin-top:10px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;border-radius:22px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}.box input,.box textarea,.box select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:7px 0;outline:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.order-card{border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0}.status{font-weight:800}.steps{display:flex;gap:5px;overflow:auto;margin:14px 0}.step{min-width:85px;text-align:center;font-size:11px;color:#aaa}.step .dot{width:15px;height:15px;border-radius:50%;background:#ddd;margin:0 auto 5px}.step.done{color:#111}.step.done .dot{background:#111}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr);padding-left:12px;padding-right:12px}.tools,.hero{padding-left:12px;padding-right:12px}.pic{height:230px}.logo{font-size:21px}.nav{padding:14px 12px}.two{grid-template-columns:1fr}.navbtn{padding:10px 12px}}
</style>
</head>
<body>
<header class="header"><nav class="nav"><div class="logo">VÉLORA</div><div class="spacer"></div><button class="navbtn light" onclick="openOrders()">My Orders</button><button class="navbtn" onclick="openCart()">🛒 Cart <span id="cartCount">0</span></button></nav></header>
<section class="hero"><h1>Curated. Simple. Yours.</h1><p>Shop the latest products from VÉLORA. Add to cart, enter delivery details and place your order securely.</p></section>
<div class="tools"><input id="search" class="search" placeholder="Search products, categories..." oninput="renderProducts()"><div id="cats"></div></div>
<main id="products" class="grid"></main>

<div id="overlay" class="overlay" onclick="closeCart()"></div>
<aside id="drawer" class="drawer">
  <button class="close" onclick="closeCart()">×</button>
  <h2>Your Cart</h2><div id="cartList"></div><h3 id="cartTotal">Total: ₹0</h3>
  <button class="checkout" onclick="checkout()">Proceed to checkout</button>
  <hr><h3>Track order</h3><input id="trackId" class="search" style="width:100%" placeholder="Order ID e.g. VLR-12345678">
  <button class="checkout" onclick="trackOrder()">Track order</button><div id="trackResult"></div>
</aside>

<div id="checkoutModal" class="modal"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2>Checkout</h2><button class="close" onclick="closeCheckout()">×</button></div>
  <input id="name" placeholder="Full name *">
  <input id="phone" inputmode="tel" placeholder="Phone number *">
  <textarea id="address" rows="3" placeholder="Full delivery address *"></textarea>
  <input id="pincode" inputmode="numeric" placeholder="PIN code *">
  <select id="payment"><option value="cod">Cash on Delivery</option><option value="online">Online payment / WhatsApp</option></select>
  <button id="placeBtn" class="checkout" onclick="placeOrder()">Place order</button>
  <div id="orderMsg"></div>
</div></div>

<div id="ordersModal" class="modal"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2>My Orders</h2><button class="close" onclick="closeOrders()">×</button></div>
  <div id="myOrders"></div>
</div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const C=window.VELORA_CONFIG||{};
const sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY);
let products=[],category="All";
let cart=JSON.parse(localStorage.getItem("velora_cart")||"[]");
let myOrders=JSON.parse(localStorage.getItem("velora_orders")||"[]");

const demo=[
 {id:"demo1",name:"Classic Oversized Tee",category:"Men",price:799,discount:0,images:["https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=85"]},
 {id:"demo2",name:"Minimal Linen Shirt",category:"Men",price:1299,discount:10,images:["https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=900&q=85"]},
 {id:"demo3",name:"Relaxed Co-ord Set",category:"Women",price:1399,discount:10,images:["https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=900&q=85"]},
 {id:"demo4",name:"Classic Cap",category:"Accessories",price:499,discount:0,images:["https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=900&q=85"]},
 {id:"demo5",name:"Premium Sneakers",category:"Footwear",price:1899,discount:10,images:["https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=85"]}
];

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function images(p){if(Array.isArray(p.images)&&p.images.length)return p.images;if(typeof p.images==="string"){try{let a=JSON.parse(p.images);if(Array.isArray(a))return a}catch{}}return p.image?[p.image]:[]}
function finalPrice(p){return Math.round(Number(p.price||0)*(1-Number(p.discount||0)/100))}
function saveCart(){localStorage.setItem("velora_cart",JSON.stringify(cart));renderCart()}
function saveOrders(){localStorage.setItem("velora_orders",JSON.stringify(myOrders))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}

async function load(){
  try{
    const {data,error}=await sb.from("products").select("*").eq("active",true).order("created_at",{ascending:false});
    if(error) throw error;
    products=(data&&data.length)?data:demo;
  }catch(e){console.warn(e);products=demo}
  renderCats();renderProducts();renderCart();
}
function renderCats(){
  const cs=["All",...new Set(products.map(p=>p.category).filter(Boolean))];
  document.getElementById("cats").innerHTML=cs.map(c=>`<button class="cat ${c===category?"active":""}" onclick="category='${esc(c)}';renderCats();renderProducts()">${esc(c)}</button>`).join(" ");
}
function renderProducts(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const list=products.filter(p=>(category==="All"||p.category===category)&&(!q||String(p.name).toLowerCase().includes(q)||String(p.category||"").toLowerCase().includes(q)));
  document.getElementById("products").innerHTML=list.length?list.map(p=>{
    const im=images(p)[0]||"";
    const price=finalPrice(p);
    return `<article class="card"><div class="pic"><img src="${esc(im)}" alt="${esc(p.name)}" onerror="this.style.display='none'">${p.discount?`<span class="badge">-${esc(p.discount)}%</span>`:""}</div><div class="info"><div class="muted">${esc(p.category||"General")}</div><h3>${esc(p.name)}</h3><div>★★★★★ <span class="muted">5.0</span></div><div class="price">₹${price.toLocaleString("en-IN")}${p.discount?`<span class="old">₹${Number(p.price).toLocaleString("en-IN")}</span>`:""}</div><button class="add" onclick="addToCart('${esc(p.id)}')">Add to cart</button><button class="review" onclick="toast('Review feature coming soon')">★ Rate & review</button></div></article>`
  }).join(""):`<div class="empty" style="grid-column:1/-1">No products found.</div>`;
}
function addToCart(id){
  const p=products.find(x=>String(x.id)===String(id));if(!p)return;
  const existing=cart.find(x=>String(x.id)===String(id));
  const item={id:p.id,name:p.name,price:finalPrice(p),image:images(p)[0]||"",qty:existing?existing.qty+1:1};
  if(existing) existing.qty++; else cart.push(item);saveCart();toast("Added to cart");
}
function renderCart(){
  document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0);
  const el=document.getElementById("cartList");
  el.innerHTML=cart.length?cart.map(x=>`<div class="cartrow"><img src="${esc(x.image)}"><div><b>${esc(x.name)}</b><div>₹${Number(x.price).toLocaleString("en-IN")}</div></div><div class="qty"><button onclick="changeQty('${esc(x.id)}',-1)">−</button> ${x.qty} <button onclick="changeQty('${esc(x.id)}',1)">+</button></div></div>`).join(""):`<div class="empty">Your cart is empty.</div>`;
  document.getElementById("cartTotal").textContent="Total: ₹"+cart.reduce((a,x)=>a+x.price*x.qty,0).toLocaleString("en-IN");
}
function changeQty(id,n){const x=cart.find(x=>String(x.id)===String(id));if(!x)return;x.qty+=n;if(x.qty<=0)cart=cart.filter(y=>String(y.id)!==String(id));saveCart()}
function openCart(){document.getElementById("drawer").classList.add("open");document.getElementById("overlay").classList.add("show")}
function closeCart(){document.getElementById("drawer").classList.remove("open");document.getElementById("overlay").classList.remove("show")}
function checkout(){if(!cart.length)return toast("Your cart is empty");document.getElementById("checkoutModal").classList.add("show")}
function closeCheckout(){document.getElementById("checkoutModal").classList.remove("show")}

function makeOrderCode(){return "VLR-"+Date.now().toString().slice(-8)}
function validPhone(v){return /^[0-9+\-\s()]{7,20}$/.test(v)}
async function placeOrder(){
  if(!cart.length)return toast("Your cart is empty");
  const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),pincode=document.getElementById("pincode").value.trim(),payment=document.getElementById("payment").value;
  if(name.length<2)return toast("Enter your full name");
  if(!validPhone(phone))return toast("Enter a valid phone number");
  if(address.length<5)return toast("Enter full delivery address");
  if(!/^[0-9]{4,10}$/.test(pincode))return toast("Enter valid PIN code");
  const total=cart.reduce((a,x)=>a+x.price*x.qty,0),code=makeOrderCode();
  const btn=document.getElementById("placeBtn");btn.disabled=true;btn.textContent="Placing order...";
  const items=cart.map(x=>({id:x.id,name:x.name,price:x.price,qty:x.qty,image:x.image}));
  const {error}=await sb.from("orders").insert({order_code:code,customer_name:name,phone,address,pincode,payment_method:payment,total,status:"placed",items});
  btn.disabled=false;btn.textContent="Place order";
  if(error){console.error(error);alert("Order failed: "+error.message);return}
  const local={order_code:code,customer_name:name,phone,address,pincode,payment_method:payment,total,status:"placed",items,created_at:new Date().toISOString()};
  myOrders.unshift(local);saveOrders();cart=[];saveCart();
  document.getElementById("orderMsg").innerHTML=`<div class="order-card"><b>Order placed successfully!</b><p>Order ID: <strong>${esc(code)}</strong></p><p>Payment: ${payment==="online"?"Online / WhatsApp":"Cash on Delivery"}</p><p>Total: <strong>₹${total.toLocaleString("en-IN")}</strong></p></div>`;
  closeCheckout();openOrders();
  if(payment==="online"){
    const wa=String(C.WHATSAPP_NUMBER||"").replace(/\D/g,"");
    if(!wa){alert("Order saved. Add your WhatsApp number in config.js to enable the WhatsApp redirect.");}
    else{
      const msg=`New VÉLORA Order%0AOrder ID: ${code}%0AName: ${name}%0APhone: ${phone}%0AAddress: ${address}%0APIN: ${pincode}%0APayment: Online%0ATotal: ₹${total}%0AItems: ${items.map(x=>x.name+" x"+x.qty).join(", ")}`;
      window.location.href=`https://wa.me/${wa}?text=${encodeURIComponent(`New VÉLORA Order\nOrder ID: ${code}\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\nPIN: ${pincode}\nPayment: Online\nTotal: ₹${total}\nItems: ${items.map(x=>x.name+" x"+x.qty).join(", ")}`)}`;
    }
  }
}
function statusTimeline(status){
  const states=["placed","confirmed","packed","shipped","out_for_delivery","delivered"],labels=["Placed","Confirmed","Packed","Shipped","Out for delivery","Delivered"],i=states.indexOf(status);
  if(status==="cancelled")return `<p><b>Cancelled</b></p>`;
  return `<div class="steps">${labels.map((l,k)=>`<div class="step ${k<=i?"done":""}"><div class="dot"></div>${l}</div>`).join("")}</div>`;
}
function renderMyOrders(){
  const el=document.getElementById("myOrders");
  el.innerHTML=myOrders.length?myOrders.map(o=>`<div class="order-card"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o.order_code)}</b><span class="status">${esc(o.status)}</span></div><div class="muted">${new Date(o.created_at).toLocaleString("en-IN")}</div><p>${esc(o.customer_name)} • ${esc(o.phone)}</p><p>${esc(o.address)}, ${esc(o.pincode)}</p><b>₹${Number(o.total).toLocaleString("en-IN")}</b>${statusTimeline(o.status)}<button class="review" onclick="trackSaved('${esc(o.order_code)}')">View order</button></div>`).join(""):`<div class="empty">No orders yet.</div>`;
}
function openOrders(){renderMyOrders();document.getElementById("ordersModal").classList.add("show")}
function closeOrders(){document.getElementById("ordersModal").classList.remove("show")}
function trackSaved(id){document.getElementById("ordersModal").classList.remove("show");openCart();document.getElementById("trackId").value=id;trackOrder()}
function trackOrder(){
  const id=document.getElementById("trackId").value.trim(),o=myOrders.find(x=>x.order_code===id);
  document.getElementById("trackResult").innerHTML=o?`<div class="order-card"><b>${esc(o.order_code)}</b><p>${esc(o.customer_name)} • ₹${Number(o.total).toLocaleString("en-IN")}</p>${statusTimeline(o.status)}</div>`:`<div class="empty">Order not found on this device. If you placed it on another device, ask the admin for the current status.</div>`;
}
load();
</script>
</body>
</html>
